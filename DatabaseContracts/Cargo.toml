[package]
name = "DatabaseContracts"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Domain-neutral contracts for database plugins"
repository = "https://github.com/ukf-kohnke/EZF-Plugin-SDK.git"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["serde"] }

[lib]
crate-type = ["rlib"]
