[package]
name = "PluginContracts"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rust-side plugin SDK and logical plugin contracts"
repository = "https://github.com/ukf-kohnke/EZF-Plugin-SDK.git"

[dependencies]
DatabaseContracts = { path = "../DatabaseContracts" }
PluginAbi = { path = "../PluginAbi" }
log = "0.4.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lib]
crate-type = ["rlib"]